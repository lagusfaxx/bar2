# ============================================================================
# BARZUO — stack completo (app + PostgreSQL)
#
# Sirve tanto para levantar el proyecto en local con Docker como para
# desplegarlo en Coolify usando "Docker Compose" como tipo de recurso.
#
# En Coolify, las variables sin valor por defecto se cargan desde la pantalla
# de Environment Variables del recurso.
# ============================================================================

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-barzuo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-barzuo}
    volumes:
      - barzuo-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-barzuo} -d ${POSTGRES_DB:-barzuo}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Se necesitan en tiempo de build: Next las inserta en el bundle.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_TIME_ZONE: ${NEXT_PUBLIC_TIME_ZONE:-America/Santiago}
        NEXT_PUBLIC_CURRENCY: ${NEXT_PUBLIC_CURRENCY:-CLP}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-barzuo}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-barzuo}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?define AUTH_SECRET (openssl rand -base64 48)}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_TIME_ZONE: ${NEXT_PUBLIC_TIME_ZONE:-America/Santiago}
      NEXT_PUBLIC_CURRENCY: ${NEXT_PUBLIC_CURRENCY:-CLP}
      UPLOAD_DIR: /app/storage/uploads
      # Token del agente de impresion del local (POS).
      PRINT_AGENT_TOKEN: ${PRINT_AGENT_TOKEN:-}
      # Contenido de demostración en el primer arranque.
      SEED_ON_START: ${SEED_ON_START:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@barzuo.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador BARZUO}
      STAFF_EMAIL: ${STAFF_EMAIL:-}
      STAFF_PASSWORD: ${STAFF_PASSWORD:-}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      # Las imágenes subidas desde el CMS deben sobrevivir a los redeploys.
      - barzuo-uploads:/app/storage
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  barzuo-db:
  barzuo-uploads:
